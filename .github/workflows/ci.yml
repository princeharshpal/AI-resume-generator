name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server 

    steps:
      - name: Checkout Code
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies 
        run: npm ci 

      - name: Run Tests
        run: npm run test